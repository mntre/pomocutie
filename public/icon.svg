<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Baby blue background circle -->
  <circle cx="50" cy="50" r="48" fill="#89CFF0"/>
  
  <!-- Bubu (white bear) - left side -->
  <g transform="translate(15, 25)">
    <!-- Ear -->
    <circle cx="5" cy="5" r="8" fill="#E8E8E8"/>
    <circle cx="5" cy="5" r="5" fill="#FFFFFF"/>
    
    <!-- Head -->
    <circle cx="15" cy="20" r="16" fill="#FFFFFF" stroke="#E5E5E5"/>
    
    <!-- Eye -->
    <circle cx="12" cy="18" r="2.5" fill="#3B2414"/>
    
    <!-- Nose -->
    <ellipse cx="15" cy="24" rx="3" ry="2" fill="#3B2414"/>
  </g>
  
  <!-- Dudu (brown panda) - right side -->
  <g transform="translate(50, 25)">
    <!-- Ear -->
    <circle cx="20" cy="5" r="8" fill="#6B4423"/>
    
    <!-- Head -->
    <circle cx="15" cy="20" r="16" fill="#A0826D"/>
    
    <!-- Eye -->
    <circle cx="18" cy="18" r="2.5" fill="#3B2414"/>
    
    <!-- Nose -->
    <ellipse cx="15" cy="24" rx="3" ry="2" fill="#3B2414"/>
    
    <!-- Blush -->
    <circle cx="23" cy="22" r="3" fill="#FFB6C1" opacity="0.6"/>
  </g>
  
  <!-- Heart in center -->
  <g transform="translate(45, 45)">
    <path d="M 5 3 C 5 1 3 0 2 1 C 1 0 -1 1 -1 3 C -1 6 2 8 2 8 C 2 8 5 6 5 3 Z" 
          fill="#FF69B4" opacity="0.8"/>
  </g>
</svg>
